name = "nexus-viral-hunter"
main = "index.js"
compatibility_date = "2024-06-01"

[triggers]
crons = [
  "0 */3 * * *",
  "0 * * * *"
]

[vars]
SUPABASE_URL = ""
DEPLOYMENT_ENV = "production"

[[secrets]]
binding = "SUPABASE_SERVICE_KEY"

[[secrets]]
binding = "SERPER_API_KEY"

[[secrets]]
binding = "YOUTUBE_API_KEY"

[[secrets]]
binding = "MODAL_API_SECRET"

[[secrets]]
binding = "MODAL_BASE_URL"
